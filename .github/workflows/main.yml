name: Deploy to AWS

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: 44.204.5.152
        username: ubuntu
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          cd ~/ASX_Analysis
          git pull
          pm2 restart asx-proxy
